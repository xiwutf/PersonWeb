# Work AI 方案页 + 前台助手 UI — PRIMARY SoT
# Admin SupportAgent / PersonalAssistant 是另一通道，勿混写
# assistant.chat.system_about 亦为 .NET AIController 身份事实唯一源头
# 能力与案例只写站内可验证的实践；未完成的能力明确标为可交付方向，不写假 KPI

badge:
  text: 站内已有可打开、可体验的 AI 实践

title: 把 AI 做成能用的产品和工具
subtitle: 取名助手、站点问答、知识库与后台智能体，已经在这个网站跑起来
description: >-
  我交付的不是概念演示，而是嵌进真实使用路径的应用：带业务规则的生成工具、能介绍项目与合作的站点助手、可持续沉淀的内容中枢，以及 Nuxt + .NET + Python 的完整接入。下面的能力都可以在站内验证，也可以按你的数据和流程再做一版。

hero_actions:
  - label: 体验取名助手
    to: /work/tools/name
    variant: primary
  - label: 沟通具体需求
    to: /work/contact
    variant: secondary

seo:
  title: AI 应用与可体验实践 | 溪午听风
  description: 本站已上线智能取名助手、站点 AI 问答与知识内容中枢，并可按业务交付智能体、知识库问答、工具产品与现有系统集成。

scenarios:
  - id: workflow-efficiency
    title: 重复流程占用大量时间
    icon: fas fa-arrows-rotate
    description: 把筛选、生成、去重、整理这类重复劳动做成可追踪的工具，而不是每次再开一轮聊天。
    examples:
      - 规则约束的内容生成
      - 表单到结果的完整链路
      - 结果去重、收藏与复用
  - id: knowledge-search
    title: 资料很多，但查找与复用困难
    icon: fas fa-book-open
    description: 先把文章、笔记和资料收拢成可检索的内容中枢，再按需要演进到带出处的问答。
    examples:
      - 统一分类与检索入口
      - 知识条目持续沉淀
      - 后续可接来源引用
  - id: product-intelligence
    title: 现有产品需要接入 AI
    icon: fas fa-puzzle-piece
    description: 在网站、管理后台或业务接口里增加真正会被用到的助手，而不是单独放一个 Demo。
    examples:
      - 网站智能助手
      - 后台内容与配置辅助
      - 对接现有 API 与权限
  - id: idea-to-mvp
    title: 有 AI 想法，但缺少落地路径
    icon: fas fa-rocket
    description: 先用最小可体验版本验证关键假设，再按真实反馈迭代，而不是一上来做大而全的平台。
    examples:
      - 需求与边界梳理
      - 可演示的关键链路
      - MVP 上线与持续迭代

capabilities:
  - id: agent-system
    title: 站点智能体与对话助手
    icon: fas fa-robot
    description: 本站右下角「问问 AI」就是正在运行的对话助手，后台可调整人设与回答边界。
    features:
      - 系统指令、会话上下文与快捷问题
      - 能介绍站内项目、能力与合作入口
      - 后台可配置助手身份，而不是写死在页面里
      - 可按你的业务再接工具调用与人工确认
  - id: ai-tools
    title: AI 工具产品化
    icon: fas fa-wand-magic-sparkles
    description: 「智能取名助手」已上线，按类型、风格、关键词和禁用词生成，不是纯聊天窗口。
    features:
      - 业务规则和大模型一起编排
      - 表单、生成、去重到可收藏的完整链路
      - 同样可做成改写、分类、提取类工具
      - Web 页面与管理后台一起交付
  - id: knowledge-qa
    title: 知识库与内容中枢
    icon: fas fa-database
    description: 文章、笔记与知识条目已在站内统一组织；带出处的问答仍在建设，适合文档多、查找难的场景。
    features:
      - 分散资料先收拢、分类、可检索
      - 为后续问答打好内容地基
      - 可演进为多轮问答与来源引用
      - 按数据边界逐步接入，不先吹已经上线
  - id: integration
    title: 接入现有网站与后台
    icon: fas fa-plug
    description: 这个网站本身就是 Nuxt 前台、.NET API 与 Python AI 服务的完整集成，而不是单独 Demo。
    features:
      - 助手嵌进现有浏览路径，访客立刻能问
      - 对接 API、数据库与权限体系
      - 配置面板、运行日志与失败兜底
      - 按你的接口落地，并控制调用成本

featured_projects:
  - id: name-tool
    title: 智能取名助手
    icon: fas fa-signature
    description: 基于业务规则与大模型的取名工具，支持类型、风格、关键词和禁用词，打开就能生成。
    highlights:
      - 规则约束，而不是随机聊天
      - 多轮生成与结果去重
      - 可扩展到品牌名、产品名等场景
    status: 可在线体验
    path: /work/tools/name
  - id: website-chat
    title: 站点 AI 助手
    icon: fas fa-comments
    description: 本站右下角「问问 AI」正在运行，能介绍项目、能力与合作入口，并带会话上下文。
    highlights:
      - 系统指令与用户消息分层
      - 快捷问题与站内内容引导
      - 后台可调整助手身份与回答边界
    status: 页面右下角可体验
    path: null
  - id: knowledge-system
    title: 个人知识库与内容中枢
    icon: fas fa-book
    description: 将分散的文章、笔记和资料统一组织，先解决「找得到」，再演进到语义检索与问答。
    highlights:
      - 统一的内容分类与检索入口
      - 支持结构化知识沉淀
      - 可扩展为带出处的 RAG 问答
    status: 持续建设中
    path: /work/knowledge

tech_stack:
  - name: 模型与智能层
    icon: fas fa-brain
    items:
      - OpenAI 与主流国产模型接入
      - Prompt、结构化输出与工具调用
      - 模型路由、缓存与成本控制
      - 效果评估与失败兜底
  - name: 服务与数据层
    icon: fas fa-server
    items:
      - Python / .NET Web API / Nitro
      - 关系数据库、向量检索与缓存
      - 任务编排、队列与定时任务
      - 鉴权、日志、限流与敏感数据保护
  - name: 产品与交互层
    icon: fas fa-desktop
    items:
      - Vue 3 / Nuxt 3 / TypeScript
      - 对话、流式响应与人工确认交互
      - 管理后台、配置面板与结果可视化
      - 响应式页面与部署交付

cooperation_steps:
  - title: 需求沟通
    description: 梳理目标用户、现有流程、数据来源与成功标准，判断 AI 是否真的适合这个问题。
  - title: 方案与原型
    description: 拆分业务规则与模型能力，明确数据边界、技术路线、交付范围和阶段计划。
  - title: 开发与验证
    description: 优先完成关键链路，通过真实样例验证效果，并在阶段节点演示和确认。
  - title: 上线与迭代
    description: 交付代码、配置与使用说明，完善监控和兜底机制，再根据真实反馈持续优化。

cta:
  text: 取名助手可以直接体验；站点助手就在页面右下角。如果你有自己的场景，也可以先聊聊问题本身，再判断应该做什么、做到哪一步。
  primary_button:
    text: 沟通你的需求
    path: /work/contact
    icon: fas fa-arrow-right
  secondary_button:
    text: 先看可体验案例
    anchor: "#projects"
    icon: fas fa-arrow-down

section_titles:
  scenarios: 哪些问题适合用 AI 解决
  scenarios_icon: fas fa-compass
  scenarios_note: 先判断问题，再选择模型与技术
  capabilities: 站内已经跑起来的能力
  capabilities_icon: fas fa-lightbulb
  capabilities_note: 四块都能在本站看到对应实践；合作时按你的数据和流程再交付一版。
  projects: 可以打开验证的 AI 实践
  projects_icon: fas fa-diagram-project
  projects_note: 只展示真实可访问、可验证的站内实践，不写假数据和未上线的产品
  projects_description: 取名助手可直接使用，站点助手在右下角即可对话，知识库仍在建设。这些链路也能复用到新的业务场景中。
  tech_stack: 技术实现与交付保障
  tech_stack_icon: fas fa-code
  cooperation: 从想法到上线的合作流程
  cooperation_icon: fas fa-handshake

# 前台 WorkAssistantHub + AIAssistant UI（非客服 SupportAgent）
assistant:
  hub:
    title: 有什么可以帮你？
    trigger_label: 问问 AI
    items:
      - id: ai
        title: 问 AI 助手
        description: 了解项目、能力与站内内容
        icon: ✦
        action: open_ai
      - id: contact
        title: 联系合作
        description: 项目开发 / 商务合作
        icon: ↗
        action: go_contact
      - id: message
        title: 留个言
        description: 建议、反馈或打个招呼
        icon: ✉
        action: open_message
  chat:
    name: AI 小智
    status_online: 在线
    status_thinking: 正在思考...
    welcome:
      eyebrow: Work 助手
      title: 你好，我是 AI 小智
      description: 可以问我站内项目、能力或合作相关的问题。
    quick_actions:
      - text: 推荐文章
        icon: article
      - text: 搜索文章
        icon: search
    # 身份事实 SoT — .NET BuildSystemPrompt 与前台助手均消费此字段
    system_about: >-
      你是「溪午听风」个人站点的助手。站长专注 AI 应用、产品开发与全栈工程，
      对外展示真实案例、可用产品与合作入口。回答应简洁、专业，不确定时引导访客前往 /work/projects、/work/products 或 /work/contact。
      本站可体验的 AI 实践包括：智能取名助手（/work/tools/name）、右下角站点问答助手、以及持续建设中的知识库（/work/knowledge）。
