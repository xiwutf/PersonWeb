items:
- id: daily-001
  category: daily
  text: 每天就几件事：健身、学习、睡够、吃够优质蛋白、拥有好心情。其他的一律不能影响这些。
  featured: true
  priority: 108
  source: ''
- id: daily-002
  category: daily
  text: 运动应该是你对身体能力的庆祝，而不是对你吃东西的惩罚。
  featured: false
  priority: 7
- id: daily-003
  category: daily
  text: 前进时不要对外展示疲惫。
  featured: false
  priority: 6
- id: daily-004
  category: daily
  text: 弱化用词。我要学习——看两眼书；运动健身——活动活动。不要把要做的事情郑重其事当回事。
  featured: false
  priority: 5
- id: daily-005
  category: daily
  text: 身材管理、形象管理：身材到位，衣服只是点缀；颜值到位，穿什么都是顶配。
  featured: false
  priority: 4
- id: daily-006
  category: daily
  text: 少接触悲情的叙事。
  featured: false
  priority: 3
  source: ''
- id: daily-007
  category: daily
  text: 看时尚杂志提升审美。
  featured: false
  priority: 2
  source: ''
- id: daily-008
  category: daily
  text: 把脑子放在发财上、把情感放在变美上、把情绪放在吃喝玩乐上——应该神采奕奕、盆满钵满。
  featured: false
  priority: 1
