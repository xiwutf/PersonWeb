items:
- id: self-001
  category: self
  text: 别用自己的期待指导别人，用来指导自己。
  featured: true
  priority: 113
  source: ''
- id: self-002
  category: self
  text: 需要认清自己是谁、想要什么、愿意做什么；之后会发现，解决自己特有问题的方案需要量身定制。
  featured: false
  priority: 12
- id: self-003
  category: self
  text: 去做你小时候需要的那个大人；去做想要的那个爱人；去做需要的那个英雄；去做你犯错时需要的批评；去做你害怕时需要的鼓励。
  featured: false
  priority: 11
- id: self-004
  category: self
  text: 别人给我上了一课，那是别人的本事；如果我走不出来，那就是我的无能。
  featured: false
  priority: 10
- id: self-005
  category: self
  text: 能点醒我的，从来不是道理，而是经历，是南墙。
  featured: false
  priority: 9
- id: self-006
  category: self
  text: 大多数人所谓的沟通，不过是把自己的想法再说一遍。
  featured: false
  priority: 8
- id: self-007
  category: self
  text: 无论讨论什么事情，都以这件事情本身为目标。
  featured: false
  priority: 7
- id: self-008
  category: self
  text: 外人对孩子的态度就是对你的态度——你去领导家，会对领导的孩子挑刺各种教育吗？
  featured: false
  priority: 6
- id: self-009
  category: self
  text: 去描述眼前的画面，而不是提取脑中的信息。
  featured: false
  priority: 5
  note: 好像和表达方式、浪漫有关，出处忘了
- id: self-010
  category: self
  text: 模仿跟自己像的明星，颜值能提升一个 level。
  featured: false
  priority: 4
  note: 我也不知道我跟哪个明星像
- id: self-011
  category: self
  text: 为达目的可以不择手段，因为结局可以为手段辩护。
  featured: false
  priority: 3
  note: 《君主论》
- id: self-012
  category: self
  text: 去做一个危险的男人，不要去当一个让人安心的男人。
  featured: false
  priority: 2
- id: self-013
  category: self
  text: 男人的爆发力是性张力的一部分，包括但不限于跳得高、冲击快。
  featured: false
  priority: 1
