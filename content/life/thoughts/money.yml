items:
- id: money-001
  category: money
  text: 生命体验里是来抓机会的；抓住机会就一飞冲天。
  featured: false
  priority: 9
- id: money-002
  category: money
  text: 要做最靠近钱的职业，站在最容易接触到钱的位置。
  featured: false
  priority: 8
- id: money-003
  category: money
  text: 多做卖铲子的人，少做挖金子的人。
  featured: false
  priority: 7
- id: money-004
  category: money
  text: 事情越做越大的本质：不是你能力变强，而是更多人把利益寄托在你身上兑现。
  featured: false
  priority: 6
- id: money-005
  category: money
  text: 雄才大略——雄才（组织、动员、驾驭、推动）必须在自己身上；大略可以请顾问。
  featured: false
  priority: 5
- id: money-006
  category: money
  text: 如何获得被动收入的资产：富则投资收购；穷则自己创造。
  featured: false
  priority: 4
- id: money-007
  category: money
  text: 在通缩的地方消费；在通胀的地方投资；在内卷的赛道消遣；在泡沫的赛道赚钱。
  featured: false
  priority: 3
- id: money-008
  category: money
  text: 把博主或自媒体身份当成一个外挂的身份。
  featured: false
  priority: 2
- id: money-009
  category: money
  text: 把 loading 都换成 thinking，即可正式转为 AI 初创公司。
  featured: false
  priority: 1
