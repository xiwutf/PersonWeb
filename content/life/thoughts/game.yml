items:
- id: game-001
  category: game
  text: 博弈论就是一切核心。
  featured: false
  priority: 12
  note: 可看《社会性动物》
- id: game-002
  category: game
  text: 规则有利就打规则牌，规则无利就打感情牌。
  featured: false
  priority: 11
  note: 在资本世界找不到优势的人，往往会回到封建关系里寻找支持
- id: game-003
  category: game
  text: 行军在无人之径，交火必在有利之势。
  featured: false
  priority: 10
  note: 《孙子兵法》
- id: game-004
  category: game
  text: 不能等待是巨大的性格缺陷。多数诡道的出发点：造成对方错误判断，引诱对方失误——多方以误。
  featured: false
  priority: 9
- id: game-005
  category: game
  text: 等待是战斗的一部分，而且是很重要的组成部分。
  featured: false
  priority: 8
- id: game-006
  category: game
  text: 不该动作时什么也不做；做一次就能解决问题。小心焦虑性动作，那是最能毁人的。
  featured: false
  priority: 7
- id: game-007
  category: game
  text: 孙子兵法的计策都很简单，关键是戏怎么演。根本用不来三十六计，有三计六计就够套用了。
  featured: false
  priority: 6
- id: game-008
  category: game
  text: 踢球每一步都有假动作，但那都不是赢球的本质。忘了本谋，是每个人常犯的毛病。
  featured: false
  priority: 5
- id: game-009
  category: game
  text: 示弱不是羞耻，不要挣一时之气。
  featured: false
  priority: 4
- id: game-010
  category: game
  text: 无论何时，都要在自己手里留有一股「奇兵」。
  featured: false
  priority: 3
- id: game-011
  category: game
  text: 无论成败，领导者要自己负决策责任。
  featured: false
  priority: 2
- id: game-012
  category: game
  text: 人一旦开始享受博弈的脑子，睚眦必报的性格，身上的那股劲就回来了。
  featured: false
  priority: 1
