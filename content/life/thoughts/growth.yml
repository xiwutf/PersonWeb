items:
- id: growth-001
  category: growth
  text: 建立系统而非目标。
  featured: true
  priority: 112
  source: ''
- id: growth-013
  category: growth
  text: 先弄清楚应该别做什么事情，然后才会考虑接下来要采取的行动。
  featured: false
  priority: 21
  note: 《穷查理宝典》
- id: growth-014
  category: growth
  text: 我只想知道我将来会死在什么地方，这样我就可以永远不去那里啦。
  featured: false
  priority: 20
  note: 《穷查理宝典》· 查理很喜欢的一句妙语
- id: growth-015
  category: growth
  text: 如果每天都是人生的第一天，那我会怎么样——是不是就会疯狂地汲取这个世界的知识与信息？
  featured: false
  priority: 19
  note: 读《财富自由之路》：「把每天都当作自己人生的第一天，无论好坏，过去的就过去了。」
- id: growth-002
  category: growth
  text: 成长的方法只有一个：学习。学习、进步、成长，统称为进化。
  featured: false
  priority: 11
- id: growth-003
  category: growth
  text: 快速入门不等于成功。
  featured: false
  priority: 10
- id: growth-004
  category: growth
  text: 是否足够聪明：脑子里有多少清晰、准确、必要的概念，以及它们之间有多少清晰、准确、必要的关联。
  featured: false
  priority: 9
- id: growth-005
  category: growth
  text: 学习某个概念时，问四问——是什么 / 不是什么；和什么很像、哪里完全不同；用在哪里 / 不可以用在哪里；怎么用对、怎么用错。
  featured: false
  priority: 8
- id: growth-006
  category: growth
  text: 有了清晰的价值观，就会有决断。价值观决定方法论，再配合行动。
  featured: false
  priority: 7
- id: growth-007
  category: growth
  text: 科学在不断否定自我的同时不断进化；用时间检验价值观与方法论，好的留下打磨，不合适的去掉——这就是升级。
  featured: false
  priority: 6
- id: growth-008
  category: growth
  text: 如果能还原到最初学习时的场景（环境、心境），记忆效果会更好。
  featured: false
  priority: 5
- id: growth-009
  category: growth
  text: 间隔效应特别适用于全新内容：最少复习次数，最大复习间隔。
  featured: false
  priority: 4
- id: growth-010
  category: growth
  text: 我能想到的，一定有其他人也想到了——所以关键不是创新性，而是执行力。
  featured: false
  priority: 3
- id: growth-011
  category: growth
  text: 人们总是根据脑子里的框架来理解事实。
  featured: false
  priority: 2
- id: growth-012
  category: growth
  text: 别人理解你的程度，往往不会超过他认识自己的深度。
  featured: false
  priority: 1
