items:
- id: time-001
  category: time
  text: 把时间投资到自己的成长上最划算，时间和精力都具有排他性。
  featured: true
  priority: 108
  source: ''
- id: time-002
  category: time
  text: 不需要每天都要进步，只需要坚持下来。
  featured: false
  priority: 107
  source: ''
- id: time-003
  category: time
  text: 无视中断，方能坚持。
  featured: false
  priority: 6
  source: ''
- id: time-004
  category: time
  text: 情绪不好，说明自己在进步。
  featured: false
  priority: 5
  source: ''
- id: time-005
  category: time
  text: 不肯花钱买服务、宁愿用自己的时间省那笔钱——最合理的解释是：你认定自己的时间价值抵不上那段消耗。
  featured: false
  priority: 4
- id: time-006
  category: time
  text: 用钱换时间，省下来的钱投资自己。
  featured: false
  priority: 3
- id: time-007
  category: time
  text: 不要在使用频率较高的物品上过度节约；常用的物品，直接决定你舒服还是难受。
  featured: false
  priority: 2
- id: time-008
  category: time
  text: 如果你笃信自己的未来是向上的曲线，那么在成本线突破之前，能赚到的其实都是小钱，小到「不值得节省」的地步。
  featured: false
  priority: 1
  note: 读《财富自由之路》时的笔记
