items:
  - text: 被套话就说：你为什么这么问
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 被步步逼问就说：你缓缓再说
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 被逼表态就说：我有自己的原则
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 被拉下水就说：这事我不方便
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 被试探态度就说：你要表达什么
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 被带偏节奏就说：我们换个话题吧
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 被假意理解就说：我们的看法不同而已
    sourceImage: http://localhost:5234/upload/20260910/ee6228bd-d9a0-4d18-a81b-a2d80f83cde4.png
    scanBatch: paper-1789032098378-eevsnn
  - text: 每天就几件事：健身、学习、睡够、吃够优质蛋白、拥有好心情。其他的一律不能影响这些。
    group: 日常
    featured: true
    tone: strong
  - text: 运动应该是你对身体能力的庆祝，而不是对你吃东西的惩罚。
    group: 日常
  - text: 前进时不要对外展示疲惫。
    group: 日常
  - text: 弱化用词。我要学习——看两眼书；运动健身——活动活动。不要把要做的事情郑重其事当回事。
    group: 日常
  - text: 身材管理、形象管理：身材到位，衣服只是点缀；颜值到位，穿什么都是顶配。
    group: 日常
  - text: 少接触悲情的叙事。
    group: 日常
    tone: passing
  - text: 看时尚杂志提升审美。
    group: 日常
    tone: passing
  - text: 把脑子放在发财上、把情感放在变美上、把情绪放在吃喝玩乐上——应该神采奕奕、盆满钵满。
    group: 日常
  - text: 把时间投资到自己的成长上最划算，时间和精力都具有排他性。
    group: 时间
    featured: true
    tone: strong
  - text: 不需要每天都要进步，只需要坚持下来。
    group: 时间
    featured: true
    tone: quiet
  - text: 无视中断，方能坚持。
    group: 时间
    tone: strong
  - text: 情绪不好，说明自己在进步。
    group: 时间
    tone: curious
  - text: 不肯花钱买服务、宁愿用自己的时间省那笔钱——最合理的解释是：你认定自己的时间价值抵不上那段消耗。
    group: 时间
  - text: 用钱换时间，省下来的钱投资自己。
    group: 时间
  - text: 不要在使用频率较高的物品上过度节约；常用的物品，直接决定你舒服还是难受。
    group: 时间
  - text: 如果你笃信自己的未来是向上的曲线，那么在成本线突破之前，能赚到的其实都是小钱，小到「不值得节省」的地步。
    note: 读《财富自由之路》时的笔记
    group: 时间
  - text: 建立系统而非目标。
    group: 学习
    featured: true
    tone: strong
  - text: 成长的方法只有一个：学习。学习、进步、成长，统称为进化。
    group: 学习
  - text: 快速入门不等于成功。
    group: 学习
  - text: 是否足够聪明：脑子里有多少清晰、准确、必要的概念，以及它们之间有多少清晰、准确、必要的关联。
    group: 学习
  - text: 学习某个概念时，问四问——是什么 / 不是什么；和什么很像、哪里完全不同；用在哪里 / 不可以用在哪里；怎么用对、怎么用错。
    group: 学习
  - text: 有了清晰的价值观，就会有决断。价值观决定方法论，再配合行动。
    group: 学习
  - text: 科学在不断否定自我的同时不断进化；用时间检验价值观与方法论，好的留下打磨，不合适的去掉——这就是升级。
    group: 学习
  - text: 如果能还原到最初学习时的场景（环境、心境），记忆效果会更好。
    group: 学习
  - text: 间隔效应特别适用于全新内容：最少复习次数，最大复习间隔。
    group: 学习
  - text: 我能想到的，一定有其他人也想到了——所以关键不是创新性，而是执行力。
    group: 学习
  - text: 人们总是根据脑子里的框架来理解事实。
    group: 学习
  - text: 别人理解你的程度，往往不会超过他认识自己的深度。
    group: 学习
  - text: 博弈论就是一切核心。
    note: 可看《社会性动物》
    group: 博弈
  - text: 规则有利就打规则牌，规则无利就打感情牌。
    note: 在资本世界找不到优势的人，往往会回到封建关系里寻找支持
    group: 博弈
  - text: 行军在无人之径，交火必在有利之势。
    note: 《孙子兵法》
    group: 博弈
  - text: 不能等待是巨大的性格缺陷。多数诡道的出发点：造成对方错误判断，引诱对方失误——多方以误。
    group: 博弈
  - text: 等待是战斗的一部分，而且是很重要的组成部分。
    group: 博弈
  - text: 不该动作时什么也不做；做一次就能解决问题。小心焦虑性动作，那是最能毁人的。
    group: 博弈
  - text: 孙子兵法的计策都很简单，关键是戏怎么演。根本用不来三十六计，有三计六计就够套用了。
    group: 博弈
  - text: 踢球每一步都有假动作，但那都不是赢球的本质。忘了本谋，是每个人常犯的毛病。
    group: 博弈
  - text: 示弱不是羞耻，不要挣一时之气。
    group: 博弈
  - text: 无论何时，都要在自己手里留有一股「奇兵」。
    group: 博弈
  - text: 无论成败，领导者要自己负决策责任。
    group: 博弈
  - text: 人一旦开始享受博弈的脑子，睚眦必报的性格，身上的那股劲就回来了。
    group: 博弈
  - text: 生命体验里是来抓机会的；抓住机会就一飞冲天。
    group: 钱与位置
  - text: 要做最靠近钱的职业，站在最容易接触到钱的位置。
    group: 钱与位置
  - text: 多做卖铲子的人，少做挖金子的人。
    group: 钱与位置
  - text: 事情越做越大的本质：不是你能力变强，而是更多人把利益寄托在你身上兑现。
    group: 钱与位置
  - text: 雄才大略——雄才（组织、动员、驾驭、推动）必须在自己身上；大略可以请顾问。
    group: 钱与位置
  - text: 如何获得被动收入的资产：富则投资收购；穷则自己创造。
    group: 钱与位置
  - text: 在通缩的地方消费；在通胀的地方投资；在内卷的赛道消遣；在泡沫的赛道赚钱。
    group: 钱与位置
  - text: 把博主或自媒体身份当成一个外挂的身份。
    group: 钱与位置
  - text: 把 loading 都换成 thinking，即可正式转为 AI 初创公司。
    group: 钱与位置
  - text: 别用自己的期待指导别人，用来指导自己。
    group: 自我
    featured: true
    tone: quiet
  - text: 需要认清自己是谁、想要什么、愿意做什么；之后会发现，解决自己特有问题的方案需要量身定制。
    group: 自我
  - text: 去做你小时候需要的那个大人；去做想要的那个爱人；去做需要的那个英雄；去做你犯错时需要的批评；去做你害怕时需要的鼓励。
    group: 自我
  - text: 别人给我上了一课，那是别人的本事；如果我走不出来，那就是我的无能。
    group: 自我
  - text: 能点醒我的，从来不是道理，而是经历，是南墙。
    group: 自我
  - text: 大多数人所谓的沟通，不过是把自己的想法再说一遍。
    group: 自我
  - text: 无论讨论什么事情，都以这件事情本身为目标。
    group: 自我
  - text: 外人对孩子的态度就是对你的态度——你去领导家，会对领导的孩子挑刺各种教育吗？
    group: 自我
  - text: 去描述眼前的画面，而不是提取脑中的信息。
    note: 好像和表达方式、浪漫有关，出处忘了
    group: 自我
  - text: 模仿跟自己像的明星，颜值能提升一个 level。
    note: 我也不知道我跟哪个明星像
    group: 自我
  - text: 为达目的可以不择手段，因为结局可以为手段辩护。
    note: 《君主论》
    group: 自我
  - text: 去做一个危险的男人，不要去当一个让人安心的男人。
    group: 自我
  - text: 男人的爆发力是性张力的一部分，包括但不限于跳得高、冲击快。
    group: 自我
